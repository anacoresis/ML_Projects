[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-pe"
version = "0.1.0"
description = "Automated PE Header Triage & Hybrid Threat Analysis Framework"
readme = "README.md"
authors = [{ name = "Security Analyst" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pefile",
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "seaborn",
    "yara-python"
]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
